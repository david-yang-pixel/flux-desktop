name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 版本号 = package.json 的 主版本.次版本 + 构建序号，例如 1.0.7（每次构建都是新版本）
      - name: Compute version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${GITHUB_RUN_NUMBER}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      # 固定的自签名证书（存放在仓库 Secrets 中），保证每次构建的签名一致，应用内更新靠它校验安装包。
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::未配置 MACOS_CERT_P12，将使用临时签名（ad-hoc），这个版本无法在应用内自动更新"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:CERT_PASSWORD -nokeys -out "$RUNNER_TEMP/cert.pem" 2>/dev/null \
            || openssl pkcs12 -legacy -in "$RUNNER_TEMP/cert.p12" -passin env:CERT_PASSWORD -nokeys -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem" || true
          HASH="$(openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"
          security find-identity -p codesigning "$KEYCHAIN"
          echo "SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Build DMGs (arm64 + x64)
        run: |
          npm run icon
          npx electron-builder --mac dmg --arm64 --x64 --publish never
          ls -lh dist/*.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$SIGN_IDENTITY" ]; then SIGNING="证书签名，可在应用内自动更新"; else SIGNING="临时签名（ad-hoc），需手动安装"; fi
          {
            echo "**下载**：Apple Silicon（M 系列）选 \`Flux-${VERSION}-arm64.dmg\`，Intel 选 \`Flux-${VERSION}-x64.dmg\`。"
            echo
            echo "签名：${SIGNING}（提交 ${GITHUB_SHA::7}）"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" dist/*.dmg \
            --target "$GITHUB_SHA" \
            --title "Flux $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --latest
