name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 版本号 = package.json 的 主版本.次版本 + 构建序号，例如 1.0.7（每次构建都是新版本）
      - name: Compute version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${GITHUB_RUN_NUMBER}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Build DMGs (arm64 + x64)
        run: |
          npm run icon
          npx electron-builder --mac dmg --arm64 --x64 --publish never
          ls -lh dist/*.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**下载**：Apple Silicon（M 系列）选 \`Flux-${VERSION}-arm64.dmg\`，Intel 选 \`Flux-${VERSION}-x64.dmg\`。"
            echo
            echo "已安装旧版本的话，可以在 Flux 菜单 › 检查更新… 里直接更新。（提交 ${GITHUB_SHA::7}）"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" dist/*.dmg \
            --target "$GITHUB_SHA" \
            --title "Flux $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --latest
